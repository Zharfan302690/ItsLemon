<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kuis Minuman It's Lemon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Pacifico&display=swap">
<style>
/* Layout: one centered card on the brand's yellow ground; question, 4 answer rows, progress dots. Result swaps in the same card with the cup on the drink's own colour. */
:root{
  --lemon:#f6c635; --cream:#fff4d6; --leaf:#0f5b34; --ink:#3b3300; --ground:#fde68a; --ground2:#f6c635;
  --display:'Pacifico',cursive; --body:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:var(--body);color:var(--ink);background:linear-gradient(180deg,var(--ground),var(--ground2)) fixed;background-color:var(--ground);
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px;font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.brand{text-align:center;color:var(--leaf);font-weight:800;letter-spacing:.14em;font-size:13px;text-transform:uppercase}
.card{background:var(--cream);border-radius:28px;padding:28px 24px;box-shadow:0 14px 30px rgba(120,80,0,.22);display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2{font-family:var(--display);font-weight:400;color:var(--leaf);margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:clamp(30px,8vw,40px)}
h2{font-size:clamp(24px,6.4vw,30px)}
p{margin:0}
.muted{opacity:.8}
.dots{display:flex;gap:8px;align-items:center}
.dot{flex:1;height:8px;border-radius:99px;background:rgba(15,91,52,.16)}
.dot.on{background:var(--leaf)}
.count{font-weight:800;color:var(--leaf);font-size:14px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;font:inherit;font-weight:700;color:var(--ink);background:#fff;border:2px solid rgba(15,91,52,.18);border-radius:18px;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:56px;transition:transform .15s,border-color .15s,background .15s}
.opt:hover{border-color:var(--leaf);transform:translateY(-1px)}
.opt:focus-visible,.btn:focus-visible,.link:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
.opt.sel{background:var(--leaf);color:var(--cream);border-color:var(--leaf)}
.opt .em{font-size:22px;flex:none;width:30px;text-align:center}
.btn{font:inherit;font-weight:800;background:var(--leaf);color:var(--cream);border:0;border-radius:99px;padding:14px 26px;cursor:pointer;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--leaf);border:2px solid var(--leaf)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.result{display:flex;flex-direction:column;gap:18px}
.stage{border-radius:22px;display:flex;justify-content:center;padding:18px 0 0;overflow:hidden}
.stage img{width:min(62%,240px);height:auto;display:block}
.eyebrow{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--leaf)}
.why{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.why li{padding-left:22px;position:relative}
.why li::before{content:"";position:absolute;left:2px;top:.6em;width:10px;height:10px;border-radius:50%;background:var(--lemon);box-shadow:0 0 0 2px var(--leaf) inset}
.alt{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:10px 14px}
.alt img{width:52px;height:65px;object-fit:contain;border-radius:12px;flex:none}
.note{background:rgba(15,91,52,.08);border-radius:16px;padding:12px 14px;font-weight:700;color:var(--leaf)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.back{align-self:flex-start;color:var(--leaf);font-weight:800;text-decoration:none;font-size:15px}
.back:hover{text-decoration:underline}
</style>

</head>

<main class="wrap">

</main>

const REASONS = {
  lemonade:['Kamu suka rasa lemon yang jelas dan segar','Cocok untuk hampir semua suasana'],

const card = document.getElementById('card');
let step = 0, picks = [];
const el = (h) => { card.innerHTML = h; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function intro(){
  step = -1; picks = [];
  el(`<h1>Minuman mana yang cocok sama kamu?</h1>
      <p class="muted">Jawab 4 pertanyaan singkat. Kami carikan satu dari 9 minuman It's Lemon yang paling pas dengan mood kamu hari ini.</p>
      <button class="btn" id="start" type="button">Mulai kuis</button>`);
  document.getElementById('start').onclick = () => { step = 0; ask(); };
}
function ask(){
  const Q = QUESTIONS[step];
  const dots = QUESTIONS.map((_, i) => `<span class="dot${i <= step ? ' on' : ''}"></span>`).join('');
  el(`<div class="dots" role="img" aria-label="Pertanyaan ${step + 1} dari ${QUESTIONS.length}">${dots}</div>
      <div class="count">Pertanyaan ${step + 1} dari ${QUESTIONS.length}</div>
      <h2>${esc(Q.q)}</h2>
      <ul class="opts">${Q.a.map((o, i) => `<li><button class="opt${picks[step] === i ? ' sel' : ''}" type="button" data-i="${i}"><span class="em" aria-hidden="true">${o.e}</span><span>${esc(o.t)}</span></button></li>`).join('')}</ul>
      <div class="row">${step > 0 ? '<button class="btn ghost" id="back" type="button">Kembali</button>' : ''}</div>`);
  card.querySelectorAll('.opt').forEach((b) => b.onclick = () => {
    picks[step] = +b.dataset.i;
    if (step < QUESTIONS.length - 1) { step++; ask(); } else { result(); }
  });
  const back = document.getElementById('back');
  if (back) back.onclick = () => { step--; ask(); };
}
function score(){
  const total = {}, first = {};
  Object.keys(DRINKS).forEach((k) => { total[k] = 0; first[k] = 0; });
  picks.forEach((pi, qi) => {
    QUESTIONS[qi].a[pi].d.forEach((k, idx) => {
      const pts = idx === 0 ? 2 : 1;
      total[k] += pts; if (qi === 0) first[k] += pts;
    });
  });
  const order = ['lemonade','blue','currant','strawberry','mint','honey','soda','coconut','tea'];
  const shift = picks.reduce((s, x) => s + x, 0);
  const rank = (k) => ((order.indexOf(k) - shift) % 9 + 9) % 9;
  return Object.keys(DRINKS).sort((a, b) => total[b] - total[a] || first[b] - first[a] || rank(a) - rank(b));
}
function result(){
  const [win, alt] = score();
  const d = DRINKS[win], a = DRINKS[alt];
  el(`<div class="result">
      <div class="eyebrow">Minuman yang cocok buat kamu</div>
      <div class="stage" style="background:${d.bg}"><img src="data:image/webp;base64,${IMG[win]}" alt="${esc(d.name)}"></div>
      <h2>${esc(d.name)}</h2>
      <p>${esc(d.blurb)}</p>
      <ul class="why">${REASONS[win].map((r) => `<li>${esc(r)}</li>`).join('')}</ul>
      <div class="alt"><img src="data:image/webp;base64,${IMG[alt]}" alt="" style="background:${a.bg}"><div><div class="eyebrow">Pilihan kedua</div><strong>${esc(a.name)}</strong></div></div>
      <div class="note">Mau pesan? Sebutkan nama minumannya saat DM kami di Instagram.</div>
      <div class="row"><button class="btn" id="again" type="button">Ulangi kuis</button></div>
    </div>`);
  document.getElementById('again').onclick = intro;
}
intro();
</script>
</body>
</html>
